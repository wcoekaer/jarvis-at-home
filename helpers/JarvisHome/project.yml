name: JarvisHome
options:
  bundleIdPrefix: ${JARVIS_BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
targets:
  JarvisHome:
    type: application
    platform: iOS
    supportedDestinations: [macCatalyst]
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: JarvisHome
        LSUIElement: true
        NSHomeKitUsageDescription: Jarvis publishes your HomeKit accessory states to your MQTT broker so your home assistant can announce them.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    entitlements:
      path: Sources/JarvisHome.entitlements
      properties:
        com.apple.developer.homekit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${JARVIS_BUNDLE_PREFIX}.jarvishome
        DEVELOPMENT_TEAM: ${JARVIS_TEAM_ID}   # set in .env (see README)
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2,6"
        GENERATE_INFOPLIST_FILE: NO
